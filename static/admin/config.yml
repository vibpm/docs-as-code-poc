# Local PoC: no GitLab OAuth.
# Run alongside the site: npm run cms
# For GitLab later, replace with backend.name: gitlab + OAuth app_id.
backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: master

# editorial_workflow is not supported with local proxy
# publish_mode: editorial_workflow

media_folder: static/uploads
public_folder: /uploads

collections:

  - name: blocks
    label: Общие нормативные блоки
    folder: content/blocks
    create: true
    extension: mdx
    format: frontmatter

    identifier_field: id

    fields:
      - label: Stable ID
        name: id
        widget: string

      - label: Series ID
        name: series_id
        widget: string

      - label: Название
        name: title
        widget: string

      - label: Content Type
        name: content_type
        widget: hidden
        default: regulatory_block

      - label: Jurisdiction
        name: jurisdiction
        widget: string

      - label: Owner
        name: owner
        widget: string

      - label: Approver
        name: approver
        widget: string

      - label: Lifecycle
        name: lifecycle
        widget: select
        options:
          - draft
          - approved
          - effective
          - retired

      - label: Valid From
        name: valid_from
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false

      - label: Valid To
        name: valid_to
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false

      - label: Topics
        name: topics
        widget: list

      - label: Текст
        name: body
        widget: markdown

  - name: documents
    label: Документы
    folder: content/documents
    create: true
    extension: yml
    format: yaml

    identifier_field: id

    fields:
      - label: Stable ID
        name: id
        widget: string

      - label: Название
        name: title
        widget: string

      - label: Content Type
        name: content_type
        widget: hidden
        default: assembled_document

      - label: Owner
        name: owner
        widget: string

      - label: Approver
        name: approver
        widget: string

      - label: Lifecycle
        name: lifecycle
        widget: select
        options:
          - draft
          - approved
          - effective
          - retired

      - label: Valid From
        name: valid_from
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false

      - label: Sections
        name: sections
        widget: list

        fields:
          - label: Heading
            name: heading
            widget: string

          - label: Local text
            name: body
            widget: markdown
            required: false

          - label: Shared block
            name: block_ref
            widget: relation
            required: false
            collection: blocks
            search_fields:
              - title
              - id
              - series_id
            value_field: series_id
            display_fields:
              - title
              - series_id
