sections:
  - heading: О документе
    body: >
      Путеводитель по кадровым вопросам «Увольнение» (ООО «ЮрСпектр»),
      актуально на 01.09.2026. Ниже — полный текст документа. Фрагменты
      с синей полосой слева — общие нормативные блоки: они редактируются
      отдельно в CMS и при пересборке подставляются во все места документа.

  - heading: Сквозные требования при оформлении увольнения
    body: >
      Эти требования повторяются при большинстве оснований увольнения.
      Изменение блока в CMS обновляет соответствующие места документа
      после `npm run build`.

